name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pip install -r requirements.txt
      # py-pglite runs a real Postgres engine so the database tests cover Neon's dialect too
      - run: mkdir pglite_work && cd pglite_work && npm init -y && npm i @electric-sql/pglite @electric-sql/pglite-socket
      - run: python -m pytest tests -q
        env:
          PGLITE_WORK_DIR: ${{ github.workspace }}/pglite_work
      - name: api/tests/schema.pg.sql must match core/store.py
        run: python -c "from core import store; print(store.schema_sql('postgres'), end='')" | diff - api/tests/schema.pg.sql

  # backend: the JSON API (its own Cloudflare Worker)
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  # frontend: static pages (a separate Cloudflare Worker serving files)
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
      - run: npx tsc --noEmit
