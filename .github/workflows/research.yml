name: research

# The locked hold-out study: tries every model and input set on older data, then tests the one winner ONCE on the
# newest 20%. It takes a long time, so it runs monthly or by hand, and then retrains the live models with the result.
on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of each month, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        instrument: [xauusd_yf, nse_etf]
    concurrency:
      group: research-${{ matrix.instrument }}
      cancel-in-progress: false
    steps:
      - id: gate
        run: |
          if [ -n "$S" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::DATABASE_URL is not set yet, skipping. See docs/DEPLOY.md."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
        env:
          S: ${{ secrets.DATABASE_URL }}
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/cache@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          path: data
          key: bars-${{ github.run_id }}
          restore-keys: bars-
      - run: python run.py ${{ matrix.instrument }} init-db
        if: steps.gate.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -u -m research.study ${{ matrix.instrument }}
        if: steps.gate.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python run.py ${{ matrix.instrument }} train
        if: steps.gate.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
