name: deploy

# Publishes the website to Cloudflare Workers whenever web/ changes on main.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - id: gate
        working-directory: .   # web/ does not exist yet: this step runs before checkout
        run: |
          if [ -n "$S" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, skipping. See docs/DEPLOY.md."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
        env:
          S: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: steps.gate.outputs.ok == 'true'
      - run: npx opennextjs-cloudflare build
        if: steps.gate.outputs.ok == 'true'
      - run: npx opennextjs-cloudflare deploy
        if: steps.gate.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
