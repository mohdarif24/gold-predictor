name: train

# Walk-forward backtest + retrain, saved to the database. Run it once by hand after setup (Actions tab > train > Run workflow).
on:
  schedule:
    - cron: "30 2 * * 0"   # Sundays 02:30 UTC
  workflow_dispatch:

concurrency:
  group: train
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - id: gate
        run: |
          if [ -n "$S" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::DATABASE_URL is not set yet, skipping. See docs/DEPLOY.md."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
        env:
          S: ${{ secrets.DATABASE_URL }}
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/cache@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          path: |
            data
            !data/dukascopy
          key: bars-${{ github.run_id }}
          restore-keys: bars-
      - uses: actions/cache@v4   # spot gold history (core/dukascopy.py); training fills any missing days
        if: steps.gate.outputs.ok == 'true'
        with:
          path: data/dukascopy
          key: duka-${{ github.run_id }}
          restore-keys: duka-
      - run: python run.py all init-db
        if: steps.gate.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python run.py all train
        if: steps.gate.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
