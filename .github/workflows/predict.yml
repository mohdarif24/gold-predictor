name: predict

# One pass: settle virtual trades, make fresh predictions, publish candles + heartbeat, send alerts.
# GitHub's scheduler is best-effort: runs can start 5-15 minutes late and an occasional run is skipped.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: predict
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - id: gate
        run: |
          if [ -n "$S" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::DATABASE_URL is not set yet, skipping. See docs/DEPLOY.md."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
        env:
          S: ${{ secrets.DATABASE_URL }}
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.ok == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
        if: steps.gate.outputs.ok == 'true'
      # yfinance only serves ~60 days of intraday bars; keeping what we fetched lets the history grow
      - uses: actions/cache@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          path: data
          key: bars-${{ github.run_id }}
          restore-keys: bars-
      - run: python run.py all tick
        if: steps.gate.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
