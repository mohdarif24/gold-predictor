# No secrets here. MT5 credentials (optional) go in .env: MT5_LOGIN, MT5_PASSWORD, MT5_SERVER
db_path: store/predictor.db
models_dir: models
reports_dir: reports
data_dir: data

signal_threshold: 0.55      # BUY if P(up) >= thr, SELL if P(up) <= 1-thr, else WAIT
shadow:
  sl_atr: 1.5               # virtual stop loss = 1.5 x ATR
  tp_atr: 2.0               # virtual take profit = 2.0 x ATR

instruments:
  xauusd:
    label: "Gold (XAU/USD, Exness)"
    enabled: false          # set to true (or delete) once MT5 is installed and `train` has run; hides it from the client app
    source: mt5
    symbol: XAUUSD          # Exness may use a suffix (XAUUSDm, XAUUSDz); check Market Watch
    minutes_per_day: 1380
    cost_bps: 1.5           # round-trip spread+slippage as basis points of price
    htf: [H1, H4]           # higher timeframes added as features for intraday models
    bars: {M5: 60000, H1: 20000, H4: 10000, D1: 4000}
    horizons:
      - {name: 30m, tf: M5, steps: 6}
      - {name: 1h,  tf: M5, steps: 12}
      - {name: 1d,  tf: D1, steps: 1}
      - {name: 1w,  tf: D1, steps: 5}

  # Gold futures (GC=F) via yfinance: works today without MT5. Prices track XAU/USD closely but are not Exness's feed.
  xauusd_yf:
    label: "Gold futures (global)"
    source: yfinance
    symbol: GC=F
    # Yahoo keeps only ~60 days of intraday bars; years of spot XAU/USD from Dukascopy are spliced in front (free)
    history: {source: dukascopy, symbol: XAUUSD, years: 3}
    minutes_per_day: 1380
    cost_bps: 1.5
    htf: [H1]
    horizons:   # 15-minute bars: 3 years of 5-minute bars would be too slow to study on the free CI machines
      - {name: 30m, tf: M15, steps: 2}
      - {name: 1h,  tf: M15, steps: 4}
      - {name: 1d,  tf: D1, steps: 1}
      - {name: 1w,  tf: D1, steps: 5}

  nse_etf:
    label: "Gold ETF (India, NSE)"
    enabled: false          # switched off 2026-10-07: only global gold is used (set to true to bring it back)
    source: yfinance
    symbol: GOLDBEES.NS
    minutes_per_day: 375
    cost_bps: 5.0
    htf: []
    horizons:
      - {name: 30m, tf: M15, steps: 2}
      - {name: 1h,  tf: M15, steps: 4}
      - {name: 1d,  tf: D1,  steps: 1}
      - {name: 1w,  tf: D1,  steps: 5}

# Daily-only macro drivers from yfinance (lagged 1 day to avoid look-ahead)
drivers:
  # dollar and rates: gold usually falls when the dollar and real yields rise
  dxy: "DX-Y.NYB"
  usdinr: "USDINR=X"
  eurusd: "EURUSD=X"
  usdjpy: "JPY=X"
  usdcny: "CNY=X"
  us3m: "^IRX"
  us5y: "^FVX"
  us10y: "^TNX"
  us30y: "^TYX"
  tips: "TIP"          # inflation-protected bonds (real-yield proxy)
  tlt: "TLT"           # long nominal bonds
  # related metals and miners
  global_gold: "GC=F"
  silver: "SI=F"
  copper: "HG=F"
  gdx: "GDX"           # gold miners
  # risk mood and growth
  vix: "^VIX"
  spx: "^GSPC"
  oil: "CL=F"
  # added 2026-10-07 (free; each must still earn its place in the locked hold-out study)
  gvz: "^GVZ"            # gold's own volatility index (CBOE)
  btc: "BTC-USD"         # Bitcoin, sometimes traded as "digital gold"
  usdbdt: "BDT=X"        # dollar / Bangladeshi taka
  fedfunds_fut: "ZQ=F"   # 30-day Fed funds futures: 100 - price = the rate the market expects
  goldbees: "GOLDBEES.NS"  # India gold ETF in rupees: with gold and USD/INR it gives the Indian premium

# US macro series from FRED's public CSV endpoint (no key). lag = days until the value is usable (published later).
fred:
  real_yield:    {id: DFII10,   lag: 2}   # 10-year inflation-adjusted yield: the single most-watched driver of gold
  breakeven:     {id: T10YIE,   lag: 2}   # 10-year inflation expectation
  fwd_infl_5y5y: {id: T5YIFR,   lag: 2}   # inflation expected 5 to 10 years ahead
  fed_funds:     {id: DFF,      lag: 2}   # the Fed's policy rate
  curve_2s10s:   {id: T10Y2Y,   lag: 2}   # 10-year minus 2-year yield (recession signal)
  usd_broad:     {id: DTWEXBGS, lag: 3}   # trade-weighted dollar against many currencies
  # added 2026-10-07. Monthly series are dated the 1st of their month; the lag covers the publication date
  epu_us:        {id: USEPUINDXD, lag: 2}  # US economic policy uncertainty, daily, from newspapers
  cpi:           {id: CPIAUCSL, lag: 45}  # consumer prices; published around the 12th of the next month
  payrolls:      {id: PAYEMS,   lag: 38}  # jobs (NFP); published the first Friday of the next month
  pce:           {id: PCEPI,    lag: 62}  # PCE prices (the Fed's gauge); published near the end of the next month

# Geopolitical Risk index (Caldara & Iacoviello), daily, free file. lag: the file is refreshed about weekly
gpr:
  url: https://www.matteoiacoviello.com/gpr_files/data_gpr_daily_recent.xls
  lag: 7
